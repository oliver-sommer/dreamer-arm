[workspace]
authors = ["Oliver SOMMER <63651102+oliver-sommer@users.noreply.github.com>"]
channels = ["conda-forge", "pytorch", "nvidia"]
name = "dreamer-arm"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

# Apple-Silicon wheels for tensordict / torchrl ≥0.12 are tagged
# macosx_14_0_arm64; raise the deployment target so pixi picks them.
[system-requirements]
macos = "14.0"

[dependencies]
python = "3.13.*"
numpy = ">=2.4"
# dm-control 1.0.41 still references MjModel.flex_bandwidth, which mujoco 3.9
# removed; pin mujoco below 3.9 until dm-control catches up.
mujoco = ">=3.2,<3.9"
dm-control = ">=1.0.41"
einops = ">=0.8.2"
hydra-core = ">=1.3.2"
"ruamel.yaml" = ">=0.19"
pyyaml = ">=6.0.3"
pillow = ">=9.2,<12"
imageio = ">=2.37"
imageio-ffmpeg = ">=0.6"
wandb = ">=0.26"

# CUDA 12.6 wheels for Linux; macOS pip falls through to the standard PyPI index.
[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu126"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
dreamer-arm = { path = ".", editable = true }
# torch installed via pip so we can target a CUDA 12.6 build on Linux.
torch = ">=2.10"
torchrl = ">=0.12"
tensordict = ">=0.12"
gymnasium = ">=1.3"
moviepy = ">=2.0"
metaworld = { path = "third_party/metaworld", editable = true }



[feature.dev.dependencies]
pytest = ">=9"
pytest-cov = ">=7"
ruff = ">=0.15"
mypy = ">=2.1"
pre-commit = ">=4.6"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
lint = "ruff check src tests"
fmt = "ruff format src tests"
typecheck = "mypy src"
test = "pytest"
# TORCHINDUCTOR_CACHE_DIR persists torch.compile kernels across runs so only
# the very first run pays the compilation cost (~30s); subsequent runs start fast.
train = { cmd = "python -m dreamer_arm", env = { TORCHINDUCTOR_CACHE_DIR = ".torch_cache" } }
train-yam = { cmd = "python -m dreamer_arm arm=yam", env = { TORCHINDUCTOR_CACHE_DIR = ".torch_cache" } }
train-metaworld = { cmd = "python -m dreamer_arm task=metaworld", env = { TORCHINDUCTOR_CACHE_DIR = ".torch_cache" } }
# Live MuJoCo viewer window (macOS + mjpython only).
train-view = "mjpython -m dreamer_arm task.viewer=true task.env_num=1 wandb.mode=disabled"
train-metaworld-view = "mjpython -m dreamer_arm task=metaworld task.viewer=true task.env_num=1 wandb.mode=disabled"
train-metaworld-yam = "python -m dreamer_arm task=metaworld arm=yam wandb.mode=disabled"
train-metaworld-yam-view = "mjpython -m dreamer_arm task=metaworld arm=yam task.viewer=true task.env_num=1 wandb.mode=disabled"
