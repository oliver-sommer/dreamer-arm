[workspace]
authors = ["Oliver SOMMER <63651102+oliver-sommer@users.noreply.github.com>"]
channels = ["conda-forge", "pytorch", "nvidia"]
name = "dreamer-arm"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

# Apple-Silicon wheels for tensordict / torchrl ≥0.12 are tagged
# macosx_14_0_arm64; raise the deployment target so pixi picks them.
[system-requirements]
macos = "14.0"

[dependencies]
python = "3.13.*"
numpy = ">=2.4"
# dm-control 1.0.41 still references MjModel.flex_bandwidth, which mujoco 3.9
# removed; pin mujoco below 3.9 until dm-control catches up.
mujoco = ">=3.2,<3.9"
dm-control = ">=1.0.41"
einops = ">=0.8.2"
hydra-core = ">=1.3.2"
"ruamel.yaml" = ">=0.19"
pyyaml = ">=6.0.3"
pillow = ">=9.2,<12"
imageio = ">=2.37"
imageio-ffmpeg = ">=0.6"
wandb = ">=0.26"

# cu126 is the primary index so Linux gets CUDA torch; macOS gets a 404 from
# cu126 (no arm64 wheels) and falls back to PyPI for the MPS build.
# first-index avoids querying cu126 for every package in parallel, which caused
# EADDRNOTAVAIL connection errors on macOS with unsafe-best-match.
[pypi-options]
index-url = "https://download.pytorch.org/whl/cu126"
extra-index-urls = ["https://pypi.org/simple/"]
index-strategy = "first-index"

[pypi-dependencies]
dreamer-arm = { path = ".", editable = true }
# torch installed via pip so we can target a CUDA 12.6 build on Linux.
torch = ">=2.7,<2.8"
torchrl = ">=0.12"
tensordict = ">=0.12"
gymnasium = ">=1.3"
moviepy = ">=2.0"
# TODO(opt-A): replace with `metaworld = { git = "https://github.com/oliver-sommer/YAMetaworld.git" }`
#              once everything is stable — that removes the submodule and makes `pixi install` self-contained.
metaworld = { path = "third_party/metaworld", editable = true }



[feature.dev.dependencies]
pytest = ">=9"
pytest-cov = ">=7"
ruff = ">=0.15"
mypy = ">=2.1"
pre-commit = ">=4.6"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
lint = "ruff check src tests"
fmt = "ruff format src tests"
typecheck = "mypy src"
test = "pytest"
# Training. The env group + task are specified via Hydra overrides, e.g.:
#   pixi run train envs=metaworld-mt envs.task=MT10            # generalist (default group)
#   pixi run train envs=metaworld-mt envs.task=MT50 envs.env_num=50
#   pixi run train envs=metaworld    envs.task=door-open arm=yam   # single task
# TORCHINDUCTOR_CACHE_DIR persists torch.compile kernels across runs so only
# the very first run pays the compilation cost (~30s); subsequent runs start fast.
# PYTHONFAULTHANDLER prints a Python-level stack if native code segfaults (a
# 12h MT50 run died to a bare SIGSEGV with zero context otherwise).
train = { cmd = "python -m dreamer_arm", env = { TORCHINDUCTOR_CACHE_DIR = ".torch_cache", KMP_DUPLICATE_LIB_OK = "TRUE", PYTHONFAULTHANDLER = "1" } }
# Live MuJoCo viewer window (macOS + mjpython only); use a single-task env, e.g.
#   pixi run train-view envs=metaworld envs.task=door-open
train-view = { cmd = "mjpython -m dreamer_arm envs.viewer=true envs.env_num=1 wandb.mode=disabled", env = { TORCHINDUCTOR_CACHE_DIR = ".torch_cache", KMP_DUPLICATE_LIB_OK = "TRUE" } }
