[workspace]
authors = ["Oliver SOMMER <63651102+oliver-sommer@users.noreply.github.com>"]
channels = ["https://prefix.dev/conda-forge"]
name = "dreamer-arm"
# Apple-Silicon wheels for tensordict / torchrl >=0.12 are tagged
# macosx_14_0_arm64; raise the deployment target so pixi picks them.
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
numpy = ">=2.4"
# Require the MuJoCo API validated by this project. dm-control is installed
# from PyPI below because conda-forge still only publishes 1.0.41.
mujoco = ">=3.12"
# dm-control itself comes from PyPI, but its native/transitive dependencies
# stay on conda-forge so Python 3.13 uses published binaries (notably labmaze,
# whose PyPI sdist otherwise requires Bazel to build).
absl-py = ">=0.7"
dm-env = "*"
dm-tree = "!=0.1.2"
glfw = "*"
labmaze = "*"
lxml = "*"
protobuf = ">=3.19.4"
pyopengl = ">=3.1.4"
pyparsing = ">=3"
requests = "*"
setuptools = "!=50.0.0"
scipy = "*"
tqdm = "*"
hydra-core = ">=1.3.2"
pyyaml = ">=6.0.3"
pillow = ">=9.2,<12"
imageio = ">=2.37"
imageio-ffmpeg = ">=0.6"
# imageio-ffmpeg's own conda-forge dependency on ffmpeg is unconstrained, which
# let the linux-64 solve pick ffmpeg 2.8.6 (a 2016 build) instead of a current
# one -- built against an old libx264 soname that the modern x264 package
# installed alongside it doesn't provide, so the binary fails to even run
# ("libx264.so.138: cannot open shared object file"). Pin a recent major
# version explicitly so the solver can't pick a build that stale again.
ffmpeg = ">=6"
wandb = ">=0.26"

# Plain PyPI for everything.  The CUDA build of torch is pinned per-platform
# below, on the dependency itself, rather than by pointing this whole table at
# download.pytorch.org: with index-strategy = "first-index" that global setting
# silently never took effect -- every lock resolved torch from PyPI anyway (grep
# the lock for download.pytorch.org: zero wheels).  Pinning the index on the one
# package that needs it is both narrower and actually honoured.
[pypi-options]
index-strategy = "first-index"

[pypi-dependencies]
dreamer-arm = { path = ".", editable = true }
hatchling = ">=1.31"
omegaconf = ">=2.3"
# torch comes from PyPI here, which is the MPS build on macOS.  Linux overrides
# it below with a CUDA build; see [target.linux-64.pypi-dependencies].
torch = ">=2.7,<2.8"
torchrl = ">=0.12"
tensordict = ">=0.12"
gymnasium = ">=1.3"
moviepy = ">=2.0"
dm-control = "==1.0.45"
# DINO-WM's frozen ViT backbone (vit_small_patch16_dinov3.lvd1689m) — timm's
# mirror is ungated, unlike facebook/dinov3-* on the HF hub directly.
timm = ">=1.0.20"
# TODO(opt-A): replace with `metaworld = { git = "https://github.com/oliver-sommer/YAMetaworld.git" }`
#              once everything is stable — that removes the submodule and makes `pixi install` self-contained.
metaworld = { path = "thirdparty/metaworld", editable = true }



# PyPI's linux torch is built against CUDA 12.6, whose kernels stop at sm_90.
# The RTX 5070 Ti training box is Blackwell (sm_120), so that build imports
# fine, sees the GPU, then dies on the first allocation with "no kernel image is
# available for execution on the device".  CUDA 12.8 is the first toolkit with
# sm_120, so Linux takes torch from the cu128 index explicitly.
# Verify after install: torch.cuda.get_arch_list() must contain sm_120.
[target.linux-64.pypi-dependencies]
torch = { version = ">=2.7,<2.8", index = "https://download.pytorch.org/whl/cu128" }
[feature.dev.pypi-dependencies]
copier = ">=9.17"
prek = ">=0.4.11"
pytest = ">=9.1.1"
pytest-cov = ">=7"
pytest-timeout = ">=2.3"
pytest-xdist = ">=3.8"
ruff = ">=0.16"
ty = ">=0.0.64"

[feature.dev.tasks]
typecheck = "ty check src tests"
lint = "ruff check src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
# torch and MuJoCo each ship an OpenMP runtime; without this the loader aborts
# (SIGABRT) the moment both are imported. MUJOCO_GL is handled in the top-level
# dreamer_arm/__init__.py before either dependency can load.
test = { cmd = "pytest", env = { KMP_DUPLICATE_LIB_OK = "TRUE" } }
hooks = "prek install"
# One command for everything CI runs.
check = { depends-on = ["format-check", "lint", "typecheck", "test"] }
# Pull template changes: `pixi run -e dev template-update`
template-update = "copier update --trust --answers-file configs/.copier-template.yaml"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
# Training. The env group + task are specified via Hydra overrides, e.g.:
#   pixi run training envs/sim=metaworld-mt envs.sim.task=MT10            # generalist (default group)
#   pixi run training envs/sim=metaworld-mt envs.sim.task=MT50 envs.sim.env_num=50
#   pixi run training envs/sim=metaworld    envs.sim.task=door-open            # single task
#   pixi run training envs/sim=metaworld    envs.sim.task=door-open envs/sim/arms=sawyer
# TORCHINDUCTOR_CACHE_DIR persists torch.compile kernels across runs so only
# the very first run pays the compilation cost (~30s); subsequent runs start fast.
# It MUST be absolute.  Inductor stores the path verbatim, then runs g++ with
# cwd set to a scratch dir (_inductor/cpp_builder.py: run_compile_cmd(...,
# cwd=_build_tmp_dir)), so a relative path resolves against the wrong directory
# and the compile dies with "No such file or directory" on its own source file.
# torch's own default is absolute for exactly this reason.  Only CUDA compiles
# (auto_compile = torch.cuda.is_available()), so this can only bite on Linux.
# PYTHONFAULTHANDLER prints a Python-level stack if native code segfaults (a
# 12h MT50 run died to a bare SIGSEGV with zero context otherwise).
training = { cmd = "python -m dreamer_arm.training", env = { TORCHINDUCTOR_CACHE_DIR = "$PIXI_PROJECT_ROOT/.torch_cache", KMP_DUPLICATE_LIB_OK = "TRUE", PYTHONFAULTHANDLER = "1" } }
# Standalone evaluation of a saved checkpoint:
#   pixi run inference checkpoint=logs/<date>/<time>/checkpoint.pt envs.sim.task=MT10
inference = { cmd = "python -m dreamer_arm.inference.evaluate", env = { KMP_DUPLICATE_LIB_OK = "TRUE" } }
# Live MuJoCo viewer window (macOS + mjpython only).
# Works with any task / benchmark — the viewer attaches to env 0.
#   pixi run training-view envs.sim.task=door-open          # single task
#   pixi run training-view envs.sim.task=MT10               # MT10, viewer on task 0
training-view = { cmd = "mjpython -m dreamer_arm.training envs.sim.viewer=true logging.wandb.mode=disabled", env = { TORCHINDUCTOR_CACHE_DIR = "$PIXI_PROJECT_ROOT/.torch_cache", KMP_DUPLICATE_LIB_OK = "TRUE" } }
# Cartesian-controller bench — no training, checkpoint, or rendering:
#   pixi run controller-bench
#   pixi run controller-bench mode=iid envs.sim.task=door-open
#   pixi run controller-bench sweep=true mode=iid
controller-bench = { cmd = "python -m dreamer_arm.envs.sim.controller_bench", env = { KMP_DUPLICATE_LIB_OK = "TRUE" } }
