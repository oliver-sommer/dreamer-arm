[project]
name = "dreamer-arm"
version = "0.1.0"
description = "Dreamer (R2-Dreamer / DreamerV3) implementation for the i2rt YAM robotic arm in MuJoCo."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Sommer" }]

# Runtime dependencies are managed entirely through pixi.toml -- this project
# is only ever installed via `pixi install`, never `pip install dreamer-arm`
# (the pypi index doesn't carry a CUDA 12.6 torch build pixi.toml pins against
# on Linux, nor the editable `thirdparty/metaworld` submodule path).

[project.scripts]
dreamer-arm-train = "dreamer_arm.training.__main__:run"
dreamer-arm-eval = "dreamer_arm.inference.evaluate:run"
dreamer-arm-controller-bench = "dreamer_arm.envs.sim.controller_bench:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamer_arm"]

[tool.hatch.build.targets.wheel.shared-data]
"configs" = "share/dreamer-arm/configs"

[tool.hatch.build.targets.sdist]
include = ["/src/dreamer_arm", "/configs", "/tests", "/README.md", "/LICENSE", "/pyproject.toml", "/pixi.toml"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "BLE", "T10", "RUF001", "RUF002", "RUF003"]
ignore = [
  "E741",  # ambiguous variable names (l, I, O) are idiomatic in tensor code
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
"tests/*" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
# metaworld is an editable path dependency (thirdparty/metaworld); ty does not
# follow the .pth file the editable install leaves behind, so point at it here.
extra-paths = ["thirdparty/metaworld"]

# torch types submodule attributes as `Tensor | Module` and gymnasium/tensordict
# ship loose stubs, so attribute access, calls and subscripts on them are flagged
# throughout the model and env stacks.  These are the same families of diagnostic
# the previous mypy config disabled per-module; several sites still carry the
# `# type: ignore[override]` comments mypy wanted.  Suppressed globally rather
# than per-file because the noise is spread across core/, envs/ and utils/.
[tool.ty.rules]
unresolved-attribute = "ignore"
call-non-callable = "ignore"
not-subscriptable = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
# Deliberate signature variance from torch base classes: Distribution.sample /
# rsample take a temperature, Optimizer.step returns None, Conv2dSamePad narrows
# Conv2d.forward.
invalid-method-override = "ignore"
# gymnasium declares Env.metadata as an instance attribute; MetaWorldEnv makes it
# a ClassVar, which is the conventional gym pattern.
invalid-attribute-override = "ignore"
# torch.compile(self._method) rebinds a bound method to a plain callable, which
# ty reads as an arity change at the call site.  Correct at runtime.
invalid-assignment = "ignore"
missing-argument = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: long-running tests skipped by default",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
