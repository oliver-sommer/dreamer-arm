name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - run: pixi lock --check
      # MuJoCo's osmesa backend loads libOSMesa through PyOpenGL, and neither
      # conda-forge mujoco nor dm-control pulls it in.  It is needed even for
      # tests that never render: torchrl imports mujoco, and with MUJOCO_GL set
      # `import mujoco` resolves the GL backend eagerly, so without this every
      # test module dies at collection -- the pure-optimiser ones included.
      - name: Install OSMesa (headless software GL)
        run: sudo apt-get update && sudo apt-get install -y libosmesa6
      # MuJoCo has no display on CI runners; osmesa is the software fallback.
      - run: pixi run -e dev --platform linux-64 check
        env:
          MUJOCO_GL: osmesa
      - name: Build wheel and verify installed config discovery
        # Built with hatchling (already the declared build backend) rather than
        # `pip wheel`: pixi installs PyPI dependencies with uv, so the
        # environment has no pip.  The venv below gets its own via ensurepip.
        run: |
          pixi run -e dev python -m hatchling build -t wheel
          pixi run -e dev python -m venv --system-site-packages /tmp/dreamer-arm-wheel-smoke
          /tmp/dreamer-arm-wheel-smoke/bin/pip install --no-deps dist/dreamer_arm-*.whl
          cd /tmp
          /tmp/dreamer-arm-wheel-smoke/bin/python -c "from dreamer_arm.utils.config import get_config_root; assert get_config_root().is_dir()"
