# @package _global_
# Online Dreamer training.
#
# `pixi run training` with no overrides trains MT10 (the metaworld-mt default).
# The single-task group leaves envs.sim.task mandatory, so `envs/sim=metaworld` must be
# paired with an explicit task.  Override from the CLI:
#   pixi run training envs/sim=metaworld-mt envs.sim.task=MT10                   # generalist (default)
#   pixi run training envs/sim=metaworld-mt envs.sim.task=MT50 envs.sim.env_num=50
#   pixi run training envs/sim=metaworld    envs.sim.task=door-open              # single task
#   pixi run training envs/sim=metaworld    envs.sim.task=door-open envs/sim/arms=sawyer
#   pixi run training core/model=r2dreamer                              # swap to decoder-free RSSM
#   pixi run training core/model=dreamerv3                              # swap to reconstruction RSSM

defaults:
  - /core/buffer
  - /envs/sim: metaworld-mt
  # Listed after /envs/sim: dinowm.yaml's `@package _global_` override of
  # `envs.sim.size` (needed so the ViT backbone's patch grid matches the
  # rendered resolution) must be applied after /envs's own default, or the
  # later group would clobber it back to 64x64.
  - /core/model: dinowm
  - /utils/logging: default
  - _self_

entrypoint:
  _target_: dreamer_arm.training.dreamer._run

seed: 0
device: ${auto_device:}
deterministic_run: false

logdir: logs/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Path to a checkpoint from a previous run to resume from (weights, optimiser,
# step counter, episode-id counter, and best eval score).  Resuming from
# latest.pt also restores the replay buffer from the latest_buffer/ dir beside
# it; best.pt and the archives under checkpoints/ carry no buffer, so those
# resume onto an empty one.
#   pixi run training envs.sim.task=MT50 envs.sim.env_num=50 resume=logs/<date>/<time>/latest.pt
resume: null

batch_size: 16
batch_length: 64

trainer:
  steps: ${envs.sim.steps}
  # MT10 uses one pinned env per task, so this yields 1,000 transitions/task.
  prefill: 10000
  # Burn in dynamics/constraint prediction before actor-critic learning starts.
  pretrain: 500
  # Eval is expensive with shared train/eval envs: each eval steps the envs
  # for a full episode (time_limit × env_num global policy steps — 12500 for
  # MT50), so eval_every must be several times that or most env
  # compute goes to eval. Shared-env eval interrupts the current collection
  # episode, then resumes with fresh episode ids so milestones are not delayed.
  eval_every: 25000
  eval_episode_num: ${envs.sim.eval_episode_num}
  # Five fixed-seed episodes per MT10 task. This is the only evaluation used
  # to promote best.pt; the cheaper pass above remains the frequent signal.
  robust_eval_every: 100000
  robust_eval_episode_num: 50
  # Run one eval pass before the first training step, so W&B gets a baseline
  # (untrained on a fresh run, whatever `resume` restored on a resumed one)
  # instead of waiting eval_every steps for the first data point.  A no-op
  # when eval is disabled (eval_episode_num: 0).
  eval_at_start: true
  # Additional one-shot evaluations during the early learning transient.
  # Each runs before the first collection step after its milestone; milestones
  # at or below a resumed checkpoint's step are not replayed.
  # The 10k prefill already has a step-0 baseline, so early follow-ups start
  # only after WM burn-in and online actor-critic updates have begun.
  eval_warmup_steps: [12500, 15000, 20000]
  # Agent checkpoint cadence (env steps).  Refreshes <logdir>/latest.pt
  # (~a few hundred MB: weights+optimiser), atomically replaced each time.
  checkpoint_every: 50000
  # Every checkpoint on this coarser grid is also copied to
  # <logdir>/checkpoints/step_<N>.pt and kept, so there is a history to roll
  # back to; the ones in between are only ever seen as latest.pt.  Must be a
  # multiple of checkpoint_every to fire (150k = every 3rd).  0 = no archives.
  checkpoint_keep_every: 150000
  # Dump the replay buffer beside latest.pt so `resume` restarts warm instead of
  # refilling from empty.  Costs a full rewrite of the buffer's *allocation*
  # (LazyTensorStorage preallocates max_size for every key -- ~9-10 GB at
  # 64x64/500k slots) on every checkpoint, so turn it off if the run stalls
  # periodically or disk is tight.  best.pt and the archives never carry one.
  checkpoint_buffer: true
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  # Replayed transition samples per newly collected transition (DreamerV3
  # convention). One optimizer update consumes batch_size * batch_length
  # samples; this is deliberately not "update calls per env step".
  replay_ratio: ${envs.sim.replay_ratio}

  update_log_every: 1000
  # Wall-clock console liveness line (seconds; 0 disables).  `update_log_every`
  # is a step cadence, so on a slow world model the first step-line can be 20+
  # minutes out.
  heartbeat_secs: 30.0
  action_repeat: ${envs.sim.action_repeat}
