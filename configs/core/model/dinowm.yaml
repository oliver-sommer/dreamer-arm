# @package _global_
# DINO-WM (Zhou et al., 2024): frozen pretrained-ViT patch tokens + a
# frame-causal transformer predicting next-frame tokens. No reconstruction,
# no stochastic latent, no KL -- the patch tokens *are* the world-model state.
#
# `@package _global_`, not `core.model` like the other core/model variants:
# this file also has to set `envs.sim.size`, since the ViT-S/16 backbone's
# 8x8=64 patch grid is fixed at construction time and must match whatever
# resolution the env renders at. That makes `core/model=dinowm` alone
# sufficient -- consistently with `core/model=dreamerv3`/`r2dreamer` alone
# being sufficient for the RSSM variants -- with no separate
# `training=dreamer-dinowm`-style recipe and no separate `core/buffer=dinowm`
# needed either (core/buffer/default.yaml's `max_size` is computed from
# `envs.sim.size`, so it follows this file's override automatically):
#   pixi run training core/model=dinowm envs.sim.task=door-open

defaults:
  - _base
  - _self_

envs:
  sim:
    size: [128, 128]

core:
  model:
    wm: dinowm

    # A DINO-WM update contains the frame-window predictor loop plus the full
    # imagination rollout. Capturing that entire dynamic update as one
    # Inductor graph creates a scheduler graph too large for Inductor's fusion
    # pass on CUDA. Eager execution is the supported, correctness-first path
    # until the update is split into independently compilable regions.
    compile: false

    # Token-space imagination is far more expensive per start than the
    # RSSM's 2560-d vector -- see the plan's Cost table. Mandatory
    # (validate_config and build_world_model both reject wm=dinowm with
    # imag_starts unset).
    imag_starts: 64

    dinowm:
      # Fixed context window (frames) the causal predictor conditions on.
      context: 3
      # Action embedding width, tiled per patch and concatenated only inside
      # the predictor (discarded from its output).
      action_dim_embed: 10
      # Sliding windows batched into one predictor call during the world-model
      # loss.  1 = one window per call.  Measured on MPS (interleaved, median
      # of 5): 1 -> 4.95s, 8 -> 5.35s, so batching does not pay here and the
      # default stays 1.  It is a knob for wide devices, where 61 launches of
      # a 16x192-token sequence under-fills the GPU -- but it is a cliff, not a
      # slope: once the backward's recompute stops fitting, the device pages
      # and lands >20x worse than the loop.  Sweep it, don't assume.
      window_chunk: 1
      # Close the teacher-forcing gap on the autoregressive path used by
      # Dreamer imagination. Eight sampled replay contexts bound the added
      # compute. Gradients reach horizons 3/5/10; horizon 15 is diagnostic-only
      # after detaching the horizon-10 state. Every listed horizon logs both a
      # persistence baseline and model skill relative to that baseline.
      rollout:
        starts: 8
        horizons: [1, 3, 5, 10, 15]
        train_horizons: [3, 5, 10]
        # Relative weight for patches that changed from the rollout's starting
        # frame. 1.0 gives changed regions one additional normalized share;
        # raw unweighted MSE remains the reported rollout accuracy metric.
        motion_weight: 1.0
      # How reward/value/policy heads pool the last frame's spatial DINO
      # tokens. task_attention uses current proprio + exact task identity as a
      # cross-attention query, retaining task-relevant spatial information at
      # fixed width. "mean" and "flatten" remain available as ablations.
      feat_pool: task_attention
      pool_heads: 8
      cnn_keys: ${envs.sim.encoder.cnn_keys}
      mlp_keys: ${envs.sim.encoder.mlp_keys}
      encoder:
        name: "vit_small_patch16_dinov3.lvd1689m"
        pretrained: true
        image_size: 128
      predictor:
        depth: 6
        heads: 16
        dim_head: 64
        mlp_dim: 2048

    # DINO-WM's `pred` loss is the equally weighted sum of visual-token and
    # explicit proprio-state prediction MSE. Task identity is static context,
    # never a prediction target.
    loss_scales:
      rew: 1.0
      con: 1.0
      pred: 1.0
      # Same modality-balanced units as pred. Half weight improves open-loop
      # stability without displacing dense one-step supervision.
      overshoot: 0.5
      policy: 1.0
      value: 1.0
      repval: 0.3
