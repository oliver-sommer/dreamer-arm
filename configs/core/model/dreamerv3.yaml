# @package core.model
# DreamerV3 baseline: decoder-based world model with symlog-MSE
# reconstruction of every encoder modality.

defaults:
  - _base
  - _self_

rep_loss: "dreamerv3"

decoder:
  mlp_keys: ${envs.decoder.mlp_keys}
  cnn_keys: ${envs.decoder.cnn_keys}
  mlp_dist:
    name: "symlog_mse"
  cnn_dist:
    name: "mse"
  mlp:
    shape: null
    layers: 3
    units: ${core.model.units}
    act: ${core.model.act}
    norm: ${core.model.norm}
    dist:
      name: "identity"
    device: ${device}
    outscale: 1.0
    symlog_inputs: false
    name: "mlp_decoder"
  cnn:
    depth: ${core.model.depth}
    units: ${core.model.units}
    bspace: 8
    mults: [2, 3, 4, 4]
    act: ${core.model.act}
    norm: ${core.model.norm}
    kernel_size: 5
    minres: 4
    outscale: 1.0

# Reconstruction weight (applied to every decoder key by the agent).
loss_scales:
  rew: 1.0
  con: 1.0
  dyn: 1.0
  rep: 0.1
  policy: 1.0
  value: 1.0
  repval: 0.3
  recon: 1.0
