# Hydra root config for dreamer-arm.
#
# Resolution order (Hydra `defaults` list): task first, model second, then this
# file's own keys. Override from the CLI with e.g.
#   pixi run train task=dmc_vision task.task=cartpole_swingup model=dreamerv3
defaults:
  - task: yam
  - model: r2dreamer
  - override hydra/job_logging: disabled
  - _self_

seed: 0
device: ${auto_device:}
deterministic_run: false

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}

wandb:
  project: dreamer-arm
  entity: null
  mode: online
  tags: []
  name: ${task.task}-${model.rep_loss}-${seed}

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 500000
  device: ${device}
  storage_device: ${device}

trainer:
  steps: ${task.steps}
  pretrain: 0
  eval_every: 10000
  eval_episode_num: ${task.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${task.train_ratio}
  video_pred_log: false
  params_hist_log: false
  update_log_every: 5000
  action_repeat: ${task.action_repeat}

hydra:
  run:
    dir: ${logdir}
