# Hydra root config for dreamer-arm.
#
# Resolution order: arm first, envs second, model third, then this file.
#
# The specific task is MANDATORY (envs.task=???), so a bare `pixi run train`
# errors. Override from the CLI:
#   pixi run train envs=metaworld-mt envs.task=MT10           # generalist (default group)
#   pixi run train envs=metaworld-mt envs.task=MT50 envs.env_num=50
#   pixi run train envs=metaworld    envs.task=door-open          # single task
#   pixi run train envs=metaworld    envs.task=door-open arm=yam  # single task, YAM arm
defaults:
  - arm: yam
  - envs: metaworld-mt
  - model: r2dreamer
  - override hydra/job_logging: disabled
  - _self_

seed: 0
device: ${auto_device:}
deterministic_run: false

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Path to a checkpoint.pt from a previous run to resume from (weights,
# optimiser, and step counter; the replay buffer refills from scratch):
#   pixi run train envs.task=MT50 envs.env_num=50 resume=logdir/<date>/<time>/checkpoint.pt
resume: null

wandb:
  project: dreamer-arm
  entity: null
  # On vast.ai, pass wandb.mode=offline: a TLS hiccup permanently kills the
  # online stream (run shows "crashed" while training continues).  In offline
  # mode the logger uploads the run itself via `wandb sync --append` every
  # sync_interval seconds (0 disables), so the website still updates ~10 min.
  mode: online
  sync_interval: 600
  tags: []
  name: null

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 500000
  device: ${device}
  storage_device: cpu

trainer:
  steps: ${envs.steps}
  pretrain: 0
  # Eval is expensive with shared train/eval envs: each eval steps the envs
  # for a full episode (time_limit/action_repeat × env_num global steps —
  # 25000 for MT50), so eval_every must be several times that or most env
  # compute goes to eval.  The trainer additionally defers shared-env eval to
  # episode boundaries so training episodes are never truncated.
  eval_every: 50000
  eval_episode_num: ${envs.eval_episode_num}
  # Agent checkpoint cadence (env steps; 0 disables).  One file, atomically
  # replaced at <logdir>/checkpoint.pt (~a few hundred MB: weights+optimiser).
  checkpoint_every: 50000
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${envs.train_ratio}

  update_log_every: 1000
  action_repeat: ${envs.action_repeat}

hydra:
  run:
    dir: ${logdir}
