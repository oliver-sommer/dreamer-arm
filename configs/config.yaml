# Hydra root config for dreamer-arm.
#
# Resolution order: arm first, task second, model third, then this file.
#
# Override from the CLI:
#   pixi run train                                    # YAM + pick_place (defaults)
#   pixi run train arm=sawyer                         # Sawyer + pick_place
#   pixi run train task.task=reach                    # YAM + reach
#   pixi run train arm=sawyer task.task=reach         # Sawyer + reach
#   pixi run train task=dmc_vision task.task=cartpole_swingup model=dreamerv3
defaults:
  - arm: yam
  - task: manip
  - model: r2dreamer
  - override hydra/job_logging: disabled
  - _self_

seed: 0
device: ${auto_device:}
deterministic_run: false

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}

wandb:
  project: dreamer-arm
  entity: null
  mode: online
  tags: []
  name: null

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 500000
  device: ${device}
  storage_device: ${device}

trainer:
  steps: ${task.steps}
  pretrain: 0
  eval_every: 5000
  eval_episode_num: ${task.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${task.train_ratio}

  update_log_every: 1000
  action_repeat: ${task.action_repeat}

hydra:
  run:
    dir: ${logdir}
