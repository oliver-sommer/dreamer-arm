# Hydra root config for dreamer-arm.
#
# Resolution order: arm first, envs second, model third, then this file.
#
# The specific task is MANDATORY (envs.task=???), so a bare `pixi run train`
# errors. Override from the CLI:
#   pixi run train envs=metaworld-mt envs.task=MT10           # generalist (default group)
#   pixi run train envs=metaworld-mt envs.task=MT50 envs.env_num=50
#   pixi run train envs=metaworld    envs.task=door-open          # single task
#   pixi run train envs=metaworld    envs.task=door-open arm=yam  # single task, YAM arm
defaults:
  - arm: yam
  - envs: metaworld-mt
  - model: r2dreamer
  - override hydra/job_logging: disabled
  - _self_

seed: 0
device: ${auto_device:}
deterministic_run: false

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}

wandb:
  project: dreamer-arm
  entity: null
  mode: online
  tags: []
  name: null

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 500000
  device: ${device}
  storage_device: ${device}

trainer:
  steps: ${envs.steps}
  pretrain: 0
  eval_every: 5000
  eval_episode_num: ${envs.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${envs.train_ratio}

  update_log_every: 1000
  action_repeat: ${envs.action_repeat}

hydra:
  run:
    dir: ${logdir}
