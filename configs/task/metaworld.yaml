# Meta-World MT1 task config.
#
# ``task.task`` is any MT1 task name (without -v3 suffix):
#   reach, pick-place, door-open, drawer-close, button-press, …
#
# Examples:
#   pixi run train task=metaworld                          # reach (default)
#   pixi run train task=metaworld task.task=pick-place     # pick-place
#   pixi run train-metaworld                               # reach, shortcut

name: "metaworld"
task: "reach"   # MT1 task name without -v3 suffix

steps: 1010000
env_num: 4
eval_episode_num: 10
action_repeat: 2
train_ratio: 512
time_limit: 500

seed: ${seed}
device: ${device}
size: [64, 64]

# Camera name passed to the Meta-World MuJoCo renderer.
# "corner2" gives a clean third-person view matching the published settings.
camera: corner2
viewer: false

encoder:
  mlp_keys: "$^"  # vision-only; no proprioceptive MLP stream
  cnn_keys: "image"
decoder:
  mlp_keys: "$^"
  cnn_keys: "image"
