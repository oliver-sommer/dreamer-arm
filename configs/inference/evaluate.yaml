# @package _global_
# Standalone evaluation of a saved checkpoint.
#
#   pixi run inference checkpoint=logs/<date>/<time>/best.pt envs.sim.task=MT10
#   pixi run inference checkpoint=<path> envs/sim=metaworld envs.sim.task=door-open
#   pixi run inference checkpoint=<path> core/model=r2dreamer envs.sim.task=door-open  # RSSM checkpoint
#
# Model and env groups must match those the checkpoint was trained with,
# otherwise the weights will not load into the constructed agent.

defaults:
  - /envs/sim: metaworld-mt
  # Listed after /envs/sim -- see the matching comment in training/dreamer.yaml.
  - /core/model: dinowm
  - /utils/logging: default
  - _self_

entrypoint:
  _target_: dreamer_arm.inference.evaluate._run

# Checkpoint to evaluate (mandatory).  Any of a run's checkpoints works:
# best.pt (highest 50-episode eval/success_mean), latest.pt, or checkpoints/step_<N>.pt.
checkpoint: ???

seed: 0
device: ${auto_device:}

logdir: logs/eval/${now:%Y-%m-%d}/${now:%H-%M-%S}

eval:
  # Minimum episodes to complete; rounded up to whole rounds across env_num.
  episodes: ${envs.sim.eval_episode_num}

logging:
  wandb:
    # Standalone eval prints to the console by default; opt in to W&B.
    mode: disabled
