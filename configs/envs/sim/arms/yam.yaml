# @package envs.sim.arms
# YAM 6-DOF arm — DLS-IK control parameters.
#
# max_ee_speed_m_s: maximum Cartesian speed per axis at action magnitude 1
# max_lag_m:       per-axis anti-windup leash between retained target and TCP;
#                  0.035 m preserves the former 0.35 m/s * 0.10 s servo lead
# workspace_low/high: grasp-site XYZ workspace bounds [m]. These explicit
#                  YAM bounds override Sawyer's mocap-body bounds; in
#                  particular the lower Z permits the pads to reach objects
#                  resting at z=0.02.
# damping:         DLS regularisation λ on the length-scaled task Jacobian;
#                  bounds ‖dq‖ near true kinematic degeneracies
# nullspace_gain:  strength of home-pose pull in the arm's nullspace
# ori_gain:        orientation feedback gain
# ori_weight:      rotational task priority relative to scaled translation;
#                  0 genuinely disables the orientation constraint
# joint_margin:    keep joints this far from their hard limits [rad]
# max_joint_speed_rad_s: speed used to cap the IK joint-target lookahead
# joint_target_horizon_s: time scale for nullspace gain and joint-step limits
# length_scale:    characteristic length [metres] used to make the DLS
#                  Jacobian's position and orientation rows unit-consistent
# settle_steps:    physics steps to servo to home pose at each reset

name: yam
max_ee_speed_m_s: 0.35
max_lag_m: 0.035
workspace_low: [-0.5, 0.4, 0.01]
workspace_high: [0.5, 1.0, 0.5]
damping: 0.10
nullspace_gain: 1.0
ori_gain: 1.0
max_ori_speed_rad_s: 1.0
ori_weight: 0.0
joint_margin: 0.05
max_joint_speed_rad_s: 3.0
joint_target_horizon_s: 0.10
length_scale: 0.25
settle_steps: 200
