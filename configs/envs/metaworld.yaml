# Meta-World single-task (MT1) config.
#
# ``envs.task`` is any MT1 task name (without -v3 suffix) and is MANDATORY:
#   door-open, drawer-close, button-press-topdown, window-open, …
#
# Examples:
#   pixi run train envs=metaworld envs.task=door-open
#   pixi run train envs=metaworld envs.task=drawer-close arm=yam

name: "metaworld"
task: ???   # MT1 task name without -v3 suffix (mandatory)

steps: 1010000
env_num: 4
eval_episode_num: 10
action_repeat: 2
train_ratio: 512
time_limit: 500

seed: ${seed}
device: ${device}
size: [64, 64]

# Camera name passed to the Meta-World MuJoCo renderer.
camera: corner2
viewer: false

encoder:
  mlp_keys: "$^"  # vision-only; no proprioceptive MLP stream
  cnn_keys: "image"
decoder:
  mlp_keys: "$^"
  cnn_keys: "image"
