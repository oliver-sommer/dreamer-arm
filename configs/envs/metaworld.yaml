# Meta-World single-task (MT1) config.
#
# ``envs.task`` is any MT1 task name (without -v3 suffix) and is MANDATORY:
#   door-open, drawer-close, button-press-topdown, window-open, …
#
# Examples:
#   pixi run train envs=metaworld envs.task=door-open
#   pixi run train envs=metaworld envs.task=drawer-close arm=yam

name: "metaworld"
task: ???   # MT1 task name without -v3 suffix (mandatory)

steps: 1010000
env_num: 4
eval_episode_num: 10
action_repeat: 2
train_ratio: 512
time_limit: 500

seed: ${seed}
device: ${device}
size: [64, 64]

# Jerk penalty subtracted from reward each step — discourages bang-bang control
# and encourages smooth, hardware-friendly motion for sim-to-real on YAM.
action_rate_cost: 0.02

# Camera name passed to the Meta-World MuJoCo renderer.
camera: corner2
wrist_camera: wrist     # second image stream; null to disable
camera_jitter: 0.05     # per-episode scene-camera position jitter (m); 0 disables
scene_randomize: true           # per-episode table/wall/floor texture + tint + light DR
camera_pose_randomize: true     # per-episode scene-camera viewpoint (hemisphere behind arm)
viewer: false

encoder:
  mlp_keys: "$^"  # vision-only; no proprioceptive MLP stream
  cnn_keys: "scene|wrist_image"
decoder:
  mlp_keys: "$^"
  cnn_keys: "scene|wrist_image"
