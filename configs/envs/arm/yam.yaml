# @package envs.arm
# YAM 6-DOF arm — DLS-IK control parameters.
#
# ee_step_m:       per-action increment [metres] to the accumulated TCP
#                  setpoint at action magnitude 1.0 (not a per-step bound —
#                  see max_lead_m)
# damping:         DLS regularisation λ on the length-scaled task Jacobian;
#                  bounds ‖dq‖ near true kinematic degeneracies
# nullspace_gain:  strength of home-pose pull in the arm's nullspace
# ori_gain:        orientation error weight relative to position error
# joint_margin:    keep joints this far from their hard limits [rad]
# max_joint_step:  per-step cap on max|dq_i| [rad], applied to the task and
#                  posture-bias components independently
# max_lead_m:      leash [metres] bounding how far the accumulated TCP
#                  setpoint may lead the actual TCP — the real per-step
#                  task-error bound
# length_scale:    characteristic length [metres] used to make the DLS
#                  Jacobian's position and orientation rows unit-consistent
# settle_steps:    physics steps to servo to home pose at each reset

name: yam
ee_step_m: 0.05
damping: 0.10
nullspace_gain: 1.0
ori_gain: 1.0
joint_margin: 0.05
max_joint_step: 1.0
max_lead_m: 0.25
length_scale: 0.25
settle_steps: 200
